<h3> Absence details</h3>


<div class="container-fluid">

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">


                    <form (ngSubmit)="onSubmit()" class="form-horizontal">
                        <div class="row">
                            <div class="col">
                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Type</label>
                                    <div class="col-lg-10">
                                        <select class="form-control" id="type" formControlName="name" required [(ngModel)]="absence.type" name="type" [value]="absence.type">
                                            <!-- <option>Choose type Absence</option> -->
                                            <option *ngFor="let type of typeAbsence">{{type}}</option>
                                        
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Start Date</label>
                                    <div class="col-lg-10">
                                        <input type="date" class="form-control" id="startDate" required [(ngModel)]="absence.startDate" name="startDate" [value]="absence.startDate | date:'yyyy-MM-dd'">
                                    </div>
                                </div>



                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">End Date </label>
                                    <div class="col-lg-10">
                                        <input type="date" class="form-control" id="endDate" required [(ngModel)]="absence.endDate" name="endDate" [value]="absence.endDate | date:'yyyy-MM-dd'"> 
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Status</label>
                                    <div class="col-lg-10">
                                        <select class="form-control" id="status" formControlName="name" required [(ngModel)]="absence.status" name="status" [value]="absence.status">
                                            <!-- <option>Choose status</option> -->
                                            <option *ngFor="let status of status">{{status}}</option>
                                        
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success">Submit</button>

                    </form>
                    <div [hidden]="!submitted">
                        <h4>You submitted successfully!</h4>
                    </div>
                </div>
                <!-- end card-body -->
            </div>
            <!-- end card-->
        </div>
        <!-- end col -->
    </div>
</div>
<!-- end row -->
