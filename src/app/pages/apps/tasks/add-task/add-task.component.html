<div class="container-fluid">
    <div class="row page-title align-items-center">

        <div class="col-md-3 col-xl-6">

            <h4 class="mb-1 mt-0">Create Task </h4>
        </div>
    </div>
    <div class="row">
        <div class="col-8">
            <div class="card">
                <div class="card-body">

                    <form novalidate="" (ngSubmit)="onSubmit()" class="form-horizontal">
                        <div class="row">
                            <div class="col-md-5">
                                <label class="form-group" for="name">task Name<span  class="text-danger">*</span></label>

                                <input type="text" class="form-control" id="taskName" required [(ngModel)]="task.taskName" name="taskName">
                            </div>


                        </div>
                        <br>
                        <div class="row">

                            <div class="col-md-5">
                                <div class="form-group"><label>Due Date<span  class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="date" required [(ngModel)]="task.date" [value]="task.date | date:'yyyy-MM-dd'" name="date">
                                    <!---->
                                    <div class="selectiongroup">
                                    </div>
                                    <!---->
                                </div>
                            </div>
                        </div>
                        <div class="row">

                            <div class="col-md-5">
                                <div class="form-group" for="name "><label>Status<span  class="text-danger">*</span></label>
                                    <select class="select form-control ng-untouched ng-pristine ng-valid" [(ngModel)]="task.status " name="status ">
                                        <option selected> Completed </option>
                                        <option>In Progress</option> 
                                        <option>Pending</option> 
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <div class="form-group"><label>Priority<span  class="text-danger">*</span></label>
                                    <select class="form-control" [(ngModel)]="task.priorite " name="priorite">
                                        <option selected >High</option>
                                        <option  >Medium</option>
                                        <option  >Low</option></select></div>
                            </div>
                            <div class="col-md-5">
                                <div class="form-group"><label>Employée<span  class="text-danger">*</span></label>

                                    <select class="form-control " [(ngModel)]="task.user " name="user ">
                                <option *ngFor="let user of users " [ngValue]="user ">
                                    {{user.firstname}}
                                </option>
                            </select>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <div class="form-group"><label> Projet<span  class="text-danger">*</span></label>

                                    <select class="form-control " [(ngModel)]="task.project " name="projet ">
                                <option *ngFor="let prj of projects " [ngValue]="prj ">
                                    {{prj.projectName}}
                                </option>
                            </select>
                                </div>
                            </div>
                        </div>




                        <div class="m-t-20 text-center">
                            <button class="btn btn-primary" type="submit">Create task</button>
                        </div>
                    </form>
                    <div [hidden]="!submitted">
                        <h4>You submitted successfully!</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
