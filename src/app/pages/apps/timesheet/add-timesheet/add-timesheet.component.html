<div class="row page-title align-items-center">
    <div class="col-md-3 col-xl-6">
        <h4 class="mb-1 mt-0"></h4>


    </div>
    <div class="col-md-9 col-xl-6 text-md-right">
        <div class="mt-4 mt-md-0">

        </div>
    </div>
</div>
<form novalidate="" (ngSubmit)="onSubmit()" class="form-horizontal">

    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="cra-header">
                        <h3>
                            CRA
                        </h3>
                    </div>
                    <table class="table table-striped table-bordered" style="width: 100%;">
                        <thead>
                            <tr>
                                <th>
                                </th>
                                <th class="day-cell" *ngFor="let day of days" [ngStyle]="{'background-color': (day.indexWeek == 2 || day.indexWeek == 3) ? '#e0e8f2' : '' }">{{day.indexMonth}}</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let dynamic of dynamicArray; let i = index;">
                                <td class="td-select">
                                    <div>
                                        <select class="browser-default custom-select" [(ngModel)]="dynamic.categorie ">
                    <option selected>Production</option>
                    <option>Interne</option> 
                </select>
                                    </div>
                                    <div *ngIf="dynamic.categorie == 'Interne'">
                                        <select class="browser-default custom-select" [(ngModel)]="dynamic.subCategorie ">
                    <option *ngFor="let tache of interncategories">
                      {{tache.taskName}}
                    </option>
                </select>
                                    </div>
                                    <div *ngIf="dynamic.categorie == 'Production'">
                                        <select class="browser-default custom-select" [(ngModel)]="dynamic.subCategorie ">
                    <option *ngFor="let tache of taches">
                      {{tache.taskName}}
                    </option>
                </select>
                                    </div>
                                    <!-- <div *ngIf="categorie.value == Interne">
                  <select class="browser-default custom-select" name="subCategorie ">
                    <option selected>Office</option>
                  <option>Formation</option> 
                </select>
                </div> -->
                                    <!-- <select class="form-control " [(ngModel)]="task.user " name="user ">
                  <option *ngFor="let user of users " [ngValue]="user ">
                      {{user.firstname}}
                  </option>
              </select>-->

                                </td>
                                <td *ngFor="let day of dynamic.days; let j = index" class="day-cell" [ngStyle]="{'background-color': (day.indexWeek == 2 || day.indexWeek == 3) ? '#e0e8f2' : '' }">
                                    <input [(ngModel)]="day.totalJournalier" class="input-data" type="text" />
                                </td>
                                <!--  <td>    
                  <input [(ngModel)]="dynamicArray[i].title1" class="form-control" type="text" />    
                </td>    
                <td>    
                  <input [(ngModel)]="dynamicArray[i].title2" class="form-control" type="text" />    
                </td>    
                <td>    
                  <input [(ngModel)]="dynamicArray[i].title3" class="form-control" type="text"/>    
                </td> -->
                                <td (click)="deleteRow(i)">
                                    <i class="uil uil-trash "></i>
                                </td>
                            </tr>
                            <tr>
                                <td style="align-self: center;">
                                    <i class="fa fa-plus fa-2x"></i>
                                    <button name="test" class="btn btn-soft-primary" (click)="addRow(i)" value="test">+</button>
                                </td>
                            </tr>
                        </tbody>

                    </table>
                    <div class="m-t-20 text-center">
                        <button class="btn btn-primary" type="submit">Ajouter</button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</form>
<div [hidden]="!submitted">
    <h4>You submitted successfully!</h4>
</div>
