<div class="container-fluid">
    <div class="row page-title align-items-center">

        <div class="col-md-3 col-xl-6">

            <h4 class="mb-1 mt-0">Create Project </h4>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">


                    <form (ngSubmit)="onSubmit()" class="form-horizontal">
                        <div class="row">
                            <div class="col">
                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Project Name</label>
                                    <div class="col-lg-10">

                                        <input type="text" class="form-control" id="projectName" required [(ngModel)]="project.projectName" name="projectName">
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Description</label>
                                    <div class="col-lg-10">
                                        <input type="text" class="form-control" id="description" required [(ngModel)]="project.description" name="description">
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Start Date</label>
                                    <div class="col-lg-10">
                                        <input type="date" class="form-control" id="dateDebut" required [(ngModel)]="project.dateDebut" name="dateDebut" [value]="project.dateDebut | date:'yyyy-MM-dd'">
                                    </div>
                                </div>



                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">End Date </label>
                                    <div class="col-lg-10">
                                        <input type="date" class="form-control" id="dateFin" required [(ngModel)]="project.dateFin" [value]="project.dateFin | date:'yyyy-MM-dd'" name="dateFin">
                                    </div>
                                </div>
                                <div class=" form-group row ">
                                    <label class="col-lg-2 col-form-label " for="name ">Status</label>
                                    <div class="col-lg-10 ">
                                        <select class="form-control " [(ngModel)]="project.status " name="status ">
                                            <option selected> Completed </option>
                                            <option>In Progress</option> 
                                            <option>Pending</option> 
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group row ">
                                    <label class="col-lg-2 col-form-label " for="name ">Type</label>
                                    <div class="col-lg-10 ">
                                        <select class="form-control " [(ngModel)]="project.type " name="type ">
                                            <option selected> WEB DESIGN </option>
                                            <option>ANDROID</option> 
                                            <option>WEB Development</option> 
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name"> Clients</label>
                                    <div class="col-lg-10">
                                        <select class="form-control" [(ngModel)]="project.client" name="client">
                                        <option *ngFor="let clt of clients" [ngValue]="clt">
                                            {{clt.firstname}}
                                        </option>
                                    </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success">Submit</button>

                    </form>
                    <div [hidden]="!submitted">
                        <h4>You submitted successfully!</h4>
                        <!-- <button class="btn btn-success" (click)="newEmployee()">Add</button> -->
                    </div>
                </div>
                <!-- end card-body -->
            </div>
            <!-- end card-->
        </div>
        <!-- end col -->
    </div>
</div>
<!-- end row -->
