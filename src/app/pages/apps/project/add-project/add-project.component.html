<h3>Create Project</h3>


<div class="container-fluid">

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">


                    <form (ngSubmit)="onSubmit()" class="form-horizontal">
                        <div class="row">
                            <div class="col">
                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Project Name</label>
                                    <div class="col-lg-10">

                                        <input type="text" class="form-control" id="projectName" required [(ngModel)]="project.projectName" name="projectName">
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Description</label>
                                    <div class="col-lg-10">
                                        <input type="text" class="form-control" id="description" required [(ngModel)]="project.description" name="description">
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Start Date</label>
                                    <div class="col-lg-10">
                                        <input type="date" class="form-control" id="dateDebut" required [(ngModel)]="project.dateDebut" name="dateDebut">
                                    </div>
                                </div>



                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">End Date </label>
                                    <div class="col-lg-10">
                                        <input type="date" class="form-control" id="dateFin" required [(ngModel)]="project.dateFin" name="dateFin">
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name"> Clients</label>
                                    <div class="col-lg-10">
                                        <select class="form-control" [(ngModel)]="project.client" name="client">
                                        <option *ngFor="let clt of clients" [ngValue]="clt">
                                            {{clt.firstname}}
                                        </option>
                                    </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success">Submit</button>

                    </form>
                    <div [hidden]="!submitted">
                        <h4>You submitted successfully!</h4>
                        <!-- <button class="btn btn-success" (click)="newEmployee()">Add</button> -->
                    </div>
                </div>
                <!-- end card-body -->
            </div>
            <!-- end card-->
        </div>
        <!-- end col -->
    </div>
</div>
<!-- end row -->
