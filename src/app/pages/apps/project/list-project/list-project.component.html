    <div class="row">
        <div class="col-xl-4 col-lg-6" *ngFor="let project of dataSource">
            <div class="card">
                <div class="card-body">
                    <div class="badge badge-success float-right">
                    </div>

                    <p class="text-success text-uppercase font-size-12 mb-2"></p>
                    <div class="float-right "><button (click)="projectDetails(project.id)" class="btn btn-soft-warning btn-lg" style="margin-left: 10px">Details</button>
                    </div>

                    <div class="float-right "><button (click)="deleteProject(project.id)" class="btn btn-soft-danger btn-lg">Delete</button>
                    </div>
                    <h4 cl><a href="javascript: void(0)" class="text-dark ">{{ project.projectName }}</a></h4>

                    <p class="text-muted mb-4">{{ project.description }}</p>

                    <div>
                        Client Name : {{project.client.firstname}}

                    </div>
                </div>
                <div class="card-body border-top">
                    <div class="row align-items-center">
                        <div class="col-sm-auto">
                            <ul class="list-inline mb-0">
                                <li class="list-inline-item pr-2">
                                    <a href="javascript: void(0)" class="text-muted d-inline-block" placement="top" ngbTooltip=" Strat Date">
                                        <i class="uil uil-calender mr-1"></i> {{ project.dateDebut }}
                                    </a>
                                </li>
                                <li class="list-inline-item pr-2">
                                    <a href="javascript: void(0)" class="text-muted d-inline-block" placement="top" ngbTooltip="End Date">
                                        <i class="uil uil-calender mr-1"></i> {{ project.dateFin }}
                                    </a>
                                </li>

                            </ul>
                        </div>
                        <div class="col offset-sm-1">

                        </div>
                    </div>
                </div>
            </div>
            <!-- end card -->
        </div>
    </div>


</div>
