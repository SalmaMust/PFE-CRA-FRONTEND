<div class="col-sm-8 col-xl-6">
    <h2 class="mb-3 mt-3">
        Project: {{project.projectName}}
    </h2>
</div>
<div class="container-fluid">

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">


                    <form (ngSubmit)="onSubmit()" class="form-horizontal">
                        <div class="row">
                            <div class="col">
                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Project Name</label>
                                    <div class="col-lg-8">

                                        <input type="text" class="form-control" id="projectName" required [(ngModel)]="project.projectName" name="projectName">
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Description</label>
                                    <div class="col-lg-8">
                                        <input type="text" class="form-control" id="description" required [(ngModel)]="project.description" name="description">
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Start Date </label>
                                    <div class="col-lg-8">
                                        <input type="date" class="form-control" id="dateDebut" required [(ngModel)]="project.dateDebut" name="dateDebut" [value]="project.dateDebut | date:'yyyy-MM-dd'">
                                    </div>
                                </div>



                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">End Date </label>
                                    <div class="col-lg-8">
                                        <input type="date" class="form-control" id="dateFin" required [(ngModel)]="project.dateFin" name="dateFin" [value]="project.dateFin | date:'yyyy-MM-dd'">
                                    </div>
                                </div>
                                <div class=" form-group row ">
                                    <label class="col-lg-2 col-form-label " for="name ">Status</label>
                                    <div class="col-lg-10 ">
                                        <select class="form-control " [(ngModel)]="project.status " name="status ">
                                            <option selected> Completed </option>
                                            <option>In Progress</option> 
                                            <option>Pending</option> 
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group row ">
                                    <label class="col-lg-2 col-form-label " for="name ">Type</label>
                                    <div class="col-lg-10 ">
                                        <select class="form-control " [(ngModel)]="project.type " name="type ">
                                            <option selected> WEB DESIGN </option>
                                            <option>ANDROID</option> 
                                            <option>WEB Development</option> 
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name"> Clients</label>
                                    <div class="col-lg-8">
                                        <select class="form-control" [(ngModel)]="project.client" name="client" [value]="project.client">
                                        <option *ngFor="let client of clients" [ngValue]="client">
                                            {{client.firstname}}
                                        </option>
                                    </select>
                                    </div>
                                </div>

                            </div>
                            <div class="col">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success">Submit</button>

                    </form>
                    <div [hidden]="!submitted">
                        <h4>You submitted successfully!</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="container-fluid">
    <div class="row page-title">
        <div class="col-sm-8 col-xl-6">
            <h4 class="mb-1 mt-0">
                Project: {{project.projectName}}
            </h4>
        </div>
        <div class="col-sm-4 col-xl-6 text-sm-right">
            <div class="btn-group ml-2 d-none d-sm-inline-block">
                <button type="button" class="btn btn-soft-primary btn-sm"><i class="uil uil-edit mr-1"></i>Edit</button>
            </div>
            <div class="btn-group d-none d-sm-inline-block ml-1">
                <button type="button" class="btn btn-soft-danger btn-sm"><i class="uil uil-trash-alt mr-1"></i>Delete</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-xl-8">
            <div class="card">
                <div class="card-body p-0">
                    <h6 class="card-title border-bottom p-3 mb-0 header-title">Project Overview</h6>
                    <div class="row py-1">
                        <!-- Widget -->

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- details-->
    <div class="row">
        <div class="col-xl-8">
            <div class="card">
                <div class="card-body">
                    <h6 class="mt-0 header-title">Description</h6>
                    {{project.description}}




                    <div class="row">
                        <div class="col-lg-3 col-md-6">
                            <div class="mt-4">
                                <p class="mb-2"><i class="uil-calender text-danger"></i> Start Date</p>
                                <h5 class="font-size-16">{{project.dateDebut}}</h5>
                            </div>
                        </div>
                        <div class="col-lg-3 col-md-6">
                            <div class="mt-4">
                                <p class="mb-2"><i class="uil-calendar-slash text-danger"></i> Due Date</p>
                                <h5 class="font-size-16">{{project.dateFin}}</h5>
                            </div>
                        </div>


                        <div class="col-lg-3 col-md-6">
                            <div class="mt-4">
                                <p class="mb-2"><i class="uil-user text-danger"></i> Owner</p>
                                <h5 class="font-size-16">{{project.client.firstname}}</h5>
                            </div>
                        </div>
                    </div>




                </div>
            </div>
        </div>


    </div>
</div>
