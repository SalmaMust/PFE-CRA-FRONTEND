<h3>Create Employee</h3>


<div class="container-fluid">

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">


                    <form (ngSubmit)="onSubmit()" class="form-horizontal">
                        <div class="row">
                            <div class="col">
                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Email</label>
                                    <div class="col-lg-10">

                                        <input type="text" class="form-control" id="email" required [(ngModel)]="user.email" name="email">
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Username</label>
                                    <div class="col-lg-10">
                                        <input type="text" class="form-control" id="username" required [(ngModel)]="user.username" name="username">
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Password</label>
                                    <div class="col-lg-10">
                                        <input type="password" class="form-control" id="password" required [(ngModel)]="user.password" name="password">
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">First Name</label>
                                    <div class="col-lg-10">
                                        <input type="text" class="form-control" id="firstname" required [(ngModel)]="user.firstname" name="firstname">
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-lg-2 col-form-label" for="name">Last Name</label>
                                    <div class="col-lg-10">
                                        <input type="text" class="form-control" id="lastName" required [(ngModel)]="user.lastname" name="lastName">
                                    </div>
                                </div>
                            </div>
                            <div class="col">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success">Submit</button>

                    </form>
                    <div [hidden]="!submitted">
                        <h4>You submitted successfully!</h4>
                        <!-- <button class="btn btn-success" (click)="newEmployee()">Add</button> -->
                    </div>
                </div>
                <!-- end card-body -->
            </div>
            <!-- end card-->
        </div>
        <!-- end col -->
    </div>
</div>
<!-- end row -->
